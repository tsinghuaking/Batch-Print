<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="720" height="470" fill="#f4f6fb"/>
  <rect x="0" y="0" width="720" height="52" fill="#2f6df6"/>
  <text x="24" y="33" fill="#ffffff" font-size="20" font-weight="700">批量打印工具 · Batch Print Tool</text>
  <text x="560" y="33" fill="#dce6ff" font-size="13">http://127.0.0.1:5001</text>

  <!-- printer bar -->
  <rect x="24" y="70" width="672" height="44" rx="8" fill="#ffffff" stroke="#dce0ea"/>
  <text x="40" y="98" fill="#333" font-size="14">打印机：</text>
  <rect x="96" y="82" width="320" height="22" rx="4" fill="#eef2fb" stroke="#c9d3e6"/>
  <text x="104" y="98" fill="#555" font-size="12">Generic 36C-9SeriesPCL  ★默认</text>
  <rect x="436" y="82" width="70" height="22" rx="4" fill="#eef2fb" stroke="#c9d3e6"/>
  <text x="452" y="98" fill="#555" font-size="12">刷新</text>
  <rect x="516" y="82" width="80" height="22" rx="4" fill="#eaf7ee" stroke="#9bd3ac"/>
  <text x="528" y="98" fill="#1b7a37" font-size="12">设为默认</text>

  <!-- upload area -->
  <rect x="24" y="126" width="672" height="70" rx="8" fill="#ffffff" stroke="#b9c6e6" stroke-dasharray="6 5"/>
  <text x="360" y="160" fill="#7a86a0" font-size="15" text-anchor="middle">点击或拖拽上传 PDF / Word / Excel（可多选）</text>
  <text x="360" y="182" fill="#aab3c6" font-size="12" text-anchor="middle">已加入 2 个文件</text>

  <!-- global settings -->
  <rect x="24" y="206" width="672" height="34" rx="6" fill="#f0f3fa" stroke="#dce0ea"/>
  <text x="40" y="228" fill="#444" font-size="13">全局设置：双面</text>
  <text x="150" y="228" fill="#444" font-size="13">份数 1</text>
  <text x="240" y="228" fill="#444" font-size="13">黑白</text>
  <text x="320" y="228" fill="#444" font-size="13">页码 ─</text>
  <rect x="560" y="214" width="120" height="22" rx="4" fill="#eaf7ee" stroke="#9bd3ac"/>
  <text x="588" y="230" fill="#1b7a37" font-size="12">应用到全部</text>

  <!-- table header -->
  <rect x="24" y="250" width="672" height="26" fill="#dfe6f5"/>
  <text x="40" y="268" fill="#334" font-size="12">文件名</text>
  <text x="300" y="268" fill="#334" font-size="12">双面</text>
  <text x="380" y="268" fill="#334" font-size="12">份数</text>
  <text x="450" y="268" fill="#334" font-size="12">颜色</text>
  <text x="520" y="268" fill="#334" font-size="12">页码</text>
  <text x="600" y="268" fill="#334" font-size="12">状态</text>

  <!-- row 1 -->
  <rect x="24" y="276" width="672" height="30" fill="#ffffff"/>
  <text x="40" y="296" fill="#222" font-size="12">合同A.pdf</text>
  <text x="300" y="296" fill="#555" font-size="12">单面</text>
  <text x="380" y="296" fill="#555" font-size="12">1</text>
  <text x="450" y="296" fill="#555" font-size="12">黑白</text>
  <text x="520" y="296" fill="#555" font-size="12">全</text>
  <rect x="596" y="284" width="64" height="16" rx="8" fill="#eaf7ee"/>
  <text x="628" y="296" fill="#1b7a37" font-size="11" text-anchor="middle">已完成</text>

  <!-- row 2 -->
  <rect x="24" y="306" width="672" height="30" fill="#fafbfe"/>
  <text x="40" y="326" fill="#222" font-size="12">报表.xlsx</text>
  <text x="300" y="326" fill="#555" font-size="12">长边</text>
  <text x="380" y="326" fill="#555" font-size="12">2</text>
  <text x="450" y="326" fill="#555" font-size="12">黑白</text>
  <text x="520" y="326" fill="#555" font-size="12">1-3</text>
  <rect x="596" y="314" width="64" height="16" rx="8" fill="#eaf7ee"/>
  <text x="628" y="326" fill="#1b7a37" font-size="11" text-anchor="middle">已完成</text>

  <!-- print button + log -->
  <rect x="24" y="350" width="140" height="34" rx="8" fill="#2f6df6"/>
  <text x="94" y="372" fill="#fff" font-size="14" text-anchor="middle" font-weight="700">开始打印</text>
  <rect x="180" y="350" width="516" height="92" rx="8" fill="#1e2430"/>
  <text x="194" y="372" fill="#7fe0a0" font-size="12">✓ 合同A.pdf：发送成功 [simplex,monochrome]</text>
  <text x="194" y="392" fill="#7fe0a0" font-size="12">✓ 报表.xlsx：发送成功 [duplex,monochrome,copies=2,pages=1-3]</text>
  <text x="194" y="412" fill="#9fb0c8" font-size="12">完成：成功 2 / 共 2</text>
  <text x="194" y="432" fill="#6b7a90" font-size="11">© 批量打印工具 · 文件仅本地处理，不上传网络</text>
</svg>
