<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批量打印工具</title>
<link rel="icon" href="/favicon.ico">
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; margin: 0;
         background: #f4f6f8; color: #1f2933; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 24px 18px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  #drop { border: 2px dashed #cbd5e1; border-radius: 10px; padding: 28px;
          text-align: center; color: #64748b; cursor: pointer; transition: .15s; }
  #drop.hover { border-color: #2563eb; background: #eff6ff; color: #2563eb; }
  #file { display: none; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  select, input[type=number], input[type=text] {
    padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px;
    font-size: 13px; background: #fff; }
  label { font-size: 13px; color: #374151; }
  button { cursor: pointer; border: none; border-radius: 6px; font-size: 14px;
           padding: 8px 16px; background: #2563eb; color: #fff; }
  button.ghost { background: #e5e7eb; color: #374151; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 13px; }
  th, td { border-bottom: 1px solid #eef2f7; padding: 8px 6px; text-align: left; }
  th { color: #6b7280; font-weight: 600; }
  td input[type=number] { width: 64px; }
  td input[type=text] { width: 110px; }
  .status { font-size: 12px; }
  .ok { color: #16a34a; } .bad { color: #dc2626; } .wait { color: #9ca3af; }
  .del { color: #dc2626; cursor: pointer; font-size: 12px; border: none;
         background: none; padding: 0; }
  #log { white-space: pre-wrap; font-size: 12px; color: #374151;
         max-height: 220px; overflow: auto; background: #f8fafc;
         border: 1px solid #eef2f7; border-radius: 6px; padding: 10px; }
  .hint { font-size: 12px; color: #9ca3af; margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>批量打印工具</h1>
  <div class="sub">本地程序 · 不上传任何文件到网络 · 支持 PDF / Word / Excel</div>

  <div class="card">
    <div id="drop">点击选择，或把文件拖到这里（可多选：PDF / Word / Excel）</div>
    <input type="file" id="file" multiple
           accept=".pdf,.doc,.docx,.xls,.xlsx">
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:10px;">
      <label>打印机：</label>
      <select id="printer" style="min-width:240px;"></select>
      <button class="ghost" id="refreshPrinter">刷新</button>
      <button class="ghost" id="setDefault">设为默认</button>
      <span id="printerMsg" class="status wait"></span>
    </div>
    <div class="row" style="margin-bottom:6px;">
      <label>全局设置：</label>
      <select id="gDuplex">
        <option value="simplex">单面</option>
        <option value="duplex">双面（长边翻转）</option>
        <option value="duplexshort">双面（短边翻转）</option>
      </select>
      <label>份数</label>
      <input type="number" id="gCopies" value="1" min="1" max="999">
      <select id="gColor">
        <option value="color">彩色</option>
        <option value="monochrome" selected>黑白</option>
      </select>
      <button class="ghost" id="applyAll">应用到全部</button>
    </div>
  </div>

  <div class="card">
    <table id="tbl">
      <thead>
        <tr>
          <th style="width:30%">文件</th>
          <th>双面</th><th>份数</th><th>彩色</th>
          <th>页码（留空=全部）</th><th>状态</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="hint">
      页码写法示例：<b>1-3</b>（第1到3页） · <b>1,3,5-7</b>（指定页）。
      双面/份数/彩色为整份设置；页码可按每个文件单独填。
    </div>
  </div>

  <div class="card">
    <div class="row">
      <button id="printBtn">开始打印</button>
      <span id="printMsg" class="status"></span>
    </div>
    <div id="log" style="margin-top:10px;"></div>
    <div class="hint">
      提示：虚拟打印机（Microsoft Print to PDF / WPS PDF / Adobe PDF）会弹出“另存为”窗口，
      不适合静默批量打印；请选真实打印机。Word/Excel 会先由 LibreOffice 转成 PDF 再打印。
    </div>
  </div>
</div>

<script>
const items = [];  // {id, name, ext}

const $ = id => document.getElementById(id);
const drop = $("drop"), fileInput = $("file");

drop.onclick = () => fileInput.click();
fileInput.onchange = () => upload(fileInput.files);
["dragover","dragenter"].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.add("hover"); }));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => {
  ev.preventDefault(); drop.classList.remove("hover"); }));
drop.ondrop = ev => upload(ev.dataTransfer.files);

function upload(fileList) {
  if (!fileList || !fileList.length) return;
  $("printerMsg").textContent = "上传中…";
  let pending = fileList.length, added = 0, bad = 0;
  [...fileList].forEach(f => {
    const reader = new FileReader();
    reader.onload = () => {
      const b64 = (reader.result || "").split(",")[1] || "";
      fetch("/upload", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: f.name, data: b64 }) })
        .then(r => r.json()).then(res => {
          if (res.ok) { items.push({ id: res.id, name: res.name, ext: res.ext }); added++; }
          else { bad++; log(`✗ ${res.name}：${res.msg}`); }
        })
        .catch(e => { bad++; log(`✗ ${f.name}：上传失败 ${e}`); })
        .finally(() => {
          pending--;
          render();
          if (pending === 0)
            $("printerMsg").textContent =
              `已加入 ${added} 个${bad ? "，跳过 " + bad + " 个" : ""}`;
        });
    };
    reader.readAsDataURL(f);
  });
}

function render() {
  const tb = $("tbody"); tb.innerHTML = "";
  items.forEach((it, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${esc(it.name)}</td>
      <td><select data-i="${i}" class="d">
        <option value="simplex">单面</option>
        <option value="duplex">双面(长边)</option>
        <option value="duplexshort">双面(短边)</option></select></td>
      <td><input type="number" min="1" max="999" value="1" data-i="${i}" class="c"></td>
      <td><select data-i="${i}" class="col">
        <option value="color">彩色</option>
        <option value="monochrome" selected>黑白</option></select></td>
      <td><input type="text" placeholder="如 1-3" data-i="${i}" class="pg"></td>
      <td class="st wait">待打印</td>
      <td><button class="del" data-i="${i}">移除</button></td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll(".del").forEach(b =>
    b.onclick = () => { items.splice(+b.dataset.i, 1); render(); });
}

function esc(s){ return (s||"").replace(/[&<>]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function loadPrinters() {
  $("printerMsg").textContent = "读取打印机…";
  fetch("/printers").then(r => r.json()).then(list => {
    const sel = $("printer"); sel.innerHTML = "";
    list.forEach(n => {
      const o = document.createElement("option"); o.value = n; o.textContent = n;
      sel.appendChild(o);
    });
    $("printerMsg").textContent = list.length ? `共 ${list.length} 台` : "未找到打印机";
    // 预选已保存的默认打印机
    fetch("/config").then(r => r.json()).then(c => {
      if (c.default_printer && list.includes(c.default_printer))
        sel.value = c.default_printer;
    }).catch(() => {});
  }).catch(e => $("printerMsg").textContent = "读取失败：" + e);
}
$("refreshPrinter").onclick = loadPrinters;

$("setDefault").onclick = () => {
  const p = $("printer").value;
  if (!p) { alert("请先选择一台打印机"); return; }
  fetch("/default_printer", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ printer: p }) })
    .then(r => r.json()).then(res => {
      if (res.ok) $("printerMsg").textContent = "已记住默认打印机：" + p;
      else $("printerMsg").textContent = "保存失败：" + (res.error || "");
    })
    .catch(e => $("printerMsg").textContent = "保存失败：" + e);
};

$("applyAll").onclick = () => {
  const d = $("gDuplex").value, c = $("gCopies").value, col = $("gColor").value;
  document.querySelectorAll("#tbody .d").forEach(s => s.value = d);
  document.querySelectorAll("#tbody .c").forEach(s => s.value = c);
  document.querySelectorAll("#tbody .col").forEach(s => s.value = col);
};

function log(s){ const el = $("log"); el.textContent += s + "\n"; el.scrollTop = el.scrollHeight; }

$("printBtn").onclick = () => {
  if (!items.length) { $("printMsg").textContent = "请先上传文件"; return; }
  const printer = $("printer").value;
  if (!printer) { $("printMsg").textContent = "请选择打印机"; return; }
  const payload = {
    printer,
    items: items.map((it, i) => ({
      id: it.id, name: it.name,
      duplex: document.querySelectorAll("#tbody .d")[i].value,
      copies: document.querySelectorAll("#tbody .c")[i].value,
      color: document.querySelectorAll("#tbody .col")[i].value,
      pages: document.querySelectorAll("#tbody .pg")[i].value,
    }))
  };
  $("printBtn").disabled = true;
  $("printMsg").textContent = "正在打印…";
  log("== 开始打印，目标：" + printer + " ==");
  fetch("/print", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload) })
    .then(r => r.json()).then(res => {
      (res.results || []).forEach(r => {
        log((r.ok ? "✓ " : "✗ ") + r.name + "：" + r.msg +
            (r.settings ? "  [" + r.settings + "]" : ""));
        // 把对应行的状态更新为「已完成 / 失败」
        const idx = items.findIndex(it => it.id === r.id);
        if (idx >= 0) {
          const st = document.querySelectorAll("#tbody .st")[idx];
          if (st) {
            st.className = "st " + (r.ok ? "ok" : "bad");
            st.textContent = r.ok ? "已完成" : "失败";
          }
        }
      });
      $("printMsg").textContent =
        `完成：成功 ${res.ok||0} / 共 ${res.total||0}`;
      $("printBtn").disabled = false;
    })
    .catch(e => { $("printMsg").textContent = "打印失败：" + e;
                  $("printBtn").disabled = false; });
};

loadPrinters();
</script>
</body>
</html>
